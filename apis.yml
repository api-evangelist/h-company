aid: h-company
name: H Company
description: 'H Company (hcompany.ai) is a Paris-based AI lab, backed by Accel and Creandum, that builds
  the Holo family of vision-language models and a Computer-Use Agents platform for automating work on
  browsers and desktops. It ships two public APIs: the Computer-Use Agents API (agp, /api/v2) for launching,
  steering, scheduling, and observing autonomous agent sessions — with reusable agents, skills, environments,
  browser profiles, vaults, and signed webhooks — and the OpenAI-compatible Holo Models API (/v1) serving
  the Holo3 and Holo3.1 models. Typed Python and TypeScript SDKs (hai-agents), a hai CLI, an official
  MCP server, and idempotent, region-isolated (EU/US) REST round out an agent-native developer surface.'
