          items:
            $ref: '#/components/schemas/SessionSummary'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
      type: object
      required:
      - items
      - total
      - page
      title: Page[SessionSummary]
    ModelCost:
      properties:
        name:
          type: string
          title: Name
          description: Model id.
        input_tokens:
          type: integer
          title: Input Tokens
          description: Input tokens consumed.
        output_tokens:
          type: integer
          title: Output Tokens
          description: Output tokens produced.
        reasoning_tokens:
          type: integer
          title: Reasoning Tokens
          description: Reasoning tokens produced.
        input_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Input Cost
          description: Input cost in USD; null if the model is unpriced.
        output_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Output Cost
          description: Output cost in USD; null if the model is unpriced.
        reasoning_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Reasoning Cost
          description: Reasoning cost in USD; null if the model is unpriced.
        total_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Cost
          description: Total cost in USD; null if the model is unpriced.
      additionalProperties: true
      type: object
      required:
      - name
      - input_tokens
      - output_tokens
      - reasoning_tokens
      title: ModelCost
      description: Token usage and cost for a single model.
    AgentRunStatusChangeData:
      properties:
        status:
          type: string
          enum:
          - running
          - paused
          title: Status
      additionalProperties: true
      type: object
      required:
      - status
      title: AgentRunStatusChangeData
    SessionStatus:
      properties:
        status:
          $ref: '#/components/schemas/TrajectoryStatus'
          description: Current lifecycle state of the session.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Error message if the session failed; null otherwise.
        error_code:
          anyOf:
          - $ref: '#/components/schemas/SessionErrorCode'
          - type: 'null'
          description: Machine-readable failure category if the session failed or timed out; null otherwise.
        outcome:
          anyOf:
          - $ref: '#/components/schemas/AnswerOutcome'
          - type: 'null'
          description: Agent's self-assessed task outcome, set with the final answer; null until then.
        steps:
          type: integer
          title: Steps
          description: Number of steps the agent has taken.
          default: 0
        usage_per_model:
          items:
            $ref: '#/components/schemas/ModelUsage'
          type: array
          title: Usage Per Model
          description: Per-model token usage. Empty until the agent calls a model.
        subagent_session_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Subagent Session Ids
          description: Session ids of any subagents this session spawned.
      type: object
      required:
      - status
      title: SessionStatus
      description: '``GET /api/v2/sessions/{id}/status`` response.'
    AgentErrorData:
      properties:
        error:
          type: string
          title: Error
        trace:
          type: string
          title: Trace
          default: ''
        info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Info
      additionalProperties: true
      type: object
      required:
      - error
      title: AgentErrorData
    SessionErrorCode:
      type: string
      enum:
      - environment_error
      - no_answer
      - answer_validation
      - timeout
      - internal
      title: SessionErrorCode
      description: Machine-readable category of a terminal session failure.
    SessionChanges:
      properties:
        status:
          $ref: '#/components/schemas/TrajectoryStatus'
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        error_code:
          anyOf:
          - $ref: '#/components/schemas/SessionErrorCode'
          - type: 'null'
        new_events:
          items:
            $ref: '#/components/schemas/SessionEvent'
          type: array
          title: New Events
          default: []
        answer:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Answer
        outcome:
          anyOf:
          - $ref: '#/components/schemas/AnswerOutcome'
          - type: 'null'
        metrics:
          $ref: '#/components/schemas/Metrics'
      type: object
      required:
      - status
      title: SessionChanges
      description: Typed view of ``TrajectoryChanges`` for Agent API session endpoints.
    AnswerOutcome:
      type: string
      enum:
      - success
      - partial
      - infeasible
      - blocked
      title: AnswerOutcome
      description: Agent's self-assessment of how the task concluded, reported with the final answer.
    ObservationEvent:
      properties:
        kind:
          type: string
          const: observation_event
          title: Kind
          default: observation_event
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
          description: Environment that produced the observation, e.g. "web".
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        image:
          anyOf:
          - $ref: '#/components/schemas/ImageContent'
          - type: 'null'
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Environment-specific snapshot, shaped by ``type``.
      type: object
      title: ObservationEvent
      description: 'What the agent perceived this step: optional text, screenshot and environment metadata.'
    RequestStartDispatchedEvent:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        type:
          type: string
          const: RequestStartDispatchedEvent
          title: Type
        data:
          $ref: '#/components/schemas/RequestStartDispatchedData'
      additionalProperties: true
      type: object
      required:
      - timestamp
      - type
      - data
      title: RequestStartDispatchedEvent
      description: The start request was dispatched to a runner.
    ToolDefinition:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
          description: 'Tool name advertised to the model. Format: letters, digits and underscores; must start with a letter or underscore; max 64 chars.'
        description:
          type: string
          minLength: 1
          title: Description
          description: What the tool does, when to use it, and what it returns. Shown to the model verbatim.
        input_schema:
          additionalProperties: true
          type: object
          title: Input Schema
          description: JSON Schema (object type) describing the tool call arguments.
      type: object
      required:
      - name
      - description
      title: ToolDefinition
      description: 'Contract for a tool executed by the API client, not by the agent runtime.


        The agent emits a tool call matching ``input_schema``, pauses, and resumes

        once the client sends back the corresponding tool result.'
    UserMessageEvent:
      properties:
        type:
          type: string
          const: user_message
          title: Type
          default: user_message
        message:
          type: string
          title: Message
          description: Message text sent to the agent.
        images:
          items:
            type: string
          type: array
          title: Images
          description: Optional images attached to the message, as base64 data URIs.
        caller_id:
          type: string
          title: Caller Id
          default: user
      type: object
      required:
      - message
      title: UserMessageEvent
      description: The user is sending a message to an active agent.
    AgentEvent:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        type:
          type: string
          const: AgentEvent
          title: Type
        data:
          oneOf:
          - $ref: '#/components/schemas/PolicyEvent'
          - $ref: '#/components/schemas/ToolResultEvent'
          - $ref: '#/components/schemas/AnswerEvent'
          - $ref: '#/components/schemas/ErrorEvent'
          - $ref: '#/components/schemas/MessageEvent'
          - $ref: '#/components/schemas/ObservationEvent'
          - $ref: '#/components/schemas/FlowEvent'
          title: Data
          discriminator:
            propertyName: kind
            mapping:
              answer_event: '#/components/schemas/AnswerEvent'
              error_event: '#/components/schemas/ErrorEvent'
              flow_event: '#/components/schemas/FlowEvent'
              message_event: '#/components/schemas/MessageEvent'
              observation_event: '#/components/schemas/ObservationEvent'
              policy_event: '#/components/schemas/PolicyEvent'
              tool_result: '#/components/schemas/ToolResultEvent'
      additionalProperties: true
      type: object
      required:
      - timestamp
      - type
      - data
      title: AgentEvent
      description: Event emitted by the agent loop itself; ``data`` is discriminated by ``kind``.
    RequestStartDispatchedData:
      properties:
        status:
          type: string
          title: Status
      additionalProperties: true
      type: object
      required:
      - status
      title: RequestStartDispatchedData
    LiveViewUrlData:
      properties:
        live_view_url:
          type: string
          title: Live View Url
      additionalProperties: true
      type: object
      required:
      - live_view_url
      title: LiveViewUrlData
    ActiveStateChangeData:
      properties:
        state:
          type: string
          enum:
          - running
          - idle
          - awaiting_tool_results
          title: State
        pending_tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolRequest'
            type: array
          - type: 'null'
          title: Pending Tool Calls
      additionalProperties: true
      type: object
      required:
      - state
      title: ActiveStateChangeData
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
